<rect x="262.0" y="170.0" width="258.7" height="113.0" rx="12" fill="#dce7fc" stroke="#4a7fe0" stroke-width="3"/>
<text x="391.4" y="210.5" text-anchor="middle" font-size="17" fill="#1c2633">Opens the dashboard after</text>
<text x="391.4" y="232.5" text-anchor="middle" font-size="17" fill="#1c2633">each plan, or from the</text>
<text x="391.4" y="254.5" text-anchor="middle" font-size="17" fill="#1c2633">email link</text>
<rect x="1122.1" y="170.0" width="258.7" height="113.0" rx="12" fill="#dce7fc" stroke="#4a7fe0" stroke-width="3"/>
<text x="1251.4" y="210.5" text-anchor="middle" font-size="17" fill="#1c2633">Approves or changes each</text>
<text x="1251.4" y="232.5" text-anchor="middle" font-size="17" fill="#1c2633">SKU in place. Reason only</text>
<text x="1251.4" y="254.5" text-anchor="middle" font-size="17" fill="#1c2633">for big changes.</text>
<rect x="262.0" y="307.0" width="258.7" height="113.0" rx="12" fill="#e6dcfa" stroke="#8a5ad6" stroke-width="3"/>
<text x="391.4" y="347.5" text-anchor="middle" font-size="17" fill="#1c2633">Mon &amp; Thu, 06:00 IST:</text>
<text x="391.4" y="369.5" text-anchor="middle" font-size="17" fill="#1c2633">cron calls the run address</text>
<text x="391.4" y="391.5" text-anchor="middle" font-size="17" fill="#1c2633">(secret in the header)</text>
<rect x="548.7" y="444.0" width="258.7" height="113.0" rx="12" fill="#d3efe9" stroke="#2ca58d" stroke-width="3"/>
<text x="678.1" y="484.5" text-anchor="middle" font-size="17" fill="#1c2633">SAP exports: weekly sales,</text>
<text x="678.1" y="506.5" text-anchor="middle" font-size="17" fill="#1c2633">stock, SKU and distributor</text>
<text x="678.1" y="528.5" text-anchor="middle" font-size="17" fill="#1c2633">lists, calendar</text>
<rect x="835.4" y="444.0" width="258.7" height="113.0" rx="12" fill="#d3efe9" stroke="#2ca58d" stroke-width="3"/>
<text x="964.8" y="484.5" text-anchor="middle" font-size="17" fill="#1c2633">Zoho Inventory: open</text>
<text x="964.8" y="506.5" text-anchor="middle" font-size="17" fill="#1c2633">purchase orders with</text>
<text x="964.8" y="528.5" text-anchor="middle" font-size="17" fill="#1c2633">expected delivery dates</text>
<rect x="548.7" y="581.0" width="258.7" height="113.0" rx="12" fill="#fdedc0" stroke="#e0a810" stroke-width="3"/>
<text x="678.1" y="621.5" text-anchor="middle" font-size="17" fill="#1c2633">Checks every file: gaps,</text>
<text x="678.1" y="643.5" text-anchor="middle" font-size="17" fill="#1c2633">stale or negative stock,</text>
<text x="678.1" y="665.5" text-anchor="middle" font-size="17" fill="#1c2633">duplicates. Retries 3 times.</text>
<rect x="835.4" y="581.0" width="258.7" height="113.0" rx="12" fill="#fdedc0" stroke="#e0a810" stroke-width="3"/>
<text x="964.8" y="621.5" text-anchor="middle" font-size="17" fill="#1c2633">Rules version, 12- and 4-week</text>
<text x="964.8" y="643.5" text-anchor="middle" font-size="17" fill="#1c2633">averages, festival +25%,</text>
<text x="964.8" y="665.5" text-anchor="middle" font-size="17" fill="#1c2633">orders arriving in time</text>
<rect x="1122.1" y="581.0" width="258.7" height="113.0" rx="12" fill="#fdedc0" stroke="#e0a810" stroke-width="3"/>
<text x="1251.4" y="621.5" text-anchor="middle" font-size="17" fill="#1c2633">5 rules: Reorder, Demand</text>
<text x="1251.4" y="643.5" text-anchor="middle" font-size="17" fill="#1c2633">rising, Pause, OK. Unclear</text>
<text x="1251.4" y="665.5" text-anchor="middle" font-size="17" fill="#1c2633">SKUs go to judgment.</text>
<rect x="1408.8" y="718.0" width="258.7" height="113.0" rx="12" fill="#e9defa" stroke="#9a6ad8" stroke-width="3"/>
<text x="1538.1" y="758.5" text-anchor="middle" font-size="17" fill="#1c2633">One-line reason per SKU.</text>
<text x="1538.1" y="780.5" text-anchor="middle" font-size="17" fill="#1c2633">Numbers checked; never</text>
<text x="1538.1" y="802.5" text-anchor="middle" font-size="17" fill="#1c2633">changes a flag or quantity.</text>
<rect x="1122.1" y="855.0" width="258.7" height="113.0" rx="12" fill="#d5efda" stroke="#3a9a52" stroke-width="3"/>
<text x="1251.4" y="895.5" text-anchor="middle" font-size="17" fill="#1c2633">Neon saves the run, data</text>
<text x="1251.4" y="917.5" text-anchor="middle" font-size="17" fill="#1c2633">coverage, every suggestion</text>
<text x="1251.4" y="939.5" text-anchor="middle" font-size="17" fill="#1c2633">and its calculation.</text>
<rect x="1695.5" y="855.0" width="258.7" height="113.0" rx="12" fill="#d5efda" stroke="#3a9a52" stroke-width="3"/>
<text x="1824.8" y="895.5" text-anchor="middle" font-size="17" fill="#1c2633">Decision history: approve,</text>
<text x="1824.8" y="917.5" text-anchor="middle" font-size="17" fill="#1c2633">change, undo; who, when,</text>
<text x="1824.8" y="939.5" text-anchor="middle" font-size="17" fill="#1c2633">why. Nothing deleted.</text>
<rect x="1695.5" y="581.0" width="258.7" height="113.0" rx="12" fill="#ffffff" stroke="#e0474c" stroke-width="3"/>
<text x="1824.8" y="621.5" text-anchor="middle" font-size="17" fill="#1c2633">Dashboard: Today, Decisions,</text>
<text x="1824.8" y="643.5" text-anchor="middle" font-size="17" fill="#1c2633">Analytics, Settings.</text>
<text x="1824.8" y="665.5" text-anchor="middle" font-size="17" fill="#1c2633">Excel export and upload.</text>
<rect x="1695.5" y="992.0" width="258.7" height="113.0" rx="12" fill="#fbd8e4" stroke="#d9507e" stroke-width="3"/>
<text x="1824.8" y="1032.5" text-anchor="middle" font-size="17" fill="#1c2633">Resend: &quot;N SKUs need review&quot;</text>
<text x="1824.8" y="1054.5" text-anchor="middle" font-size="17" fill="#1c2633">+ Excel, Friday summary,</text>
<text x="1824.8" y="1076.5" text-anchor="middle" font-size="17" fill="#1c2633">failure notices.</text>
<rect x="1695.5" y="1129.0" width="258.7" height="113.0" rx="12" fill="#ffffff" stroke="#e0474c" stroke-width="3"/>
<text x="1824.8" y="1169.5" text-anchor="middle" font-size="17" fill="#1c2633">Raghav: decides each SKU.</text>
<text x="1824.8" y="1191.5" text-anchor="middle" font-size="17" fill="#1c2633">Procurement: orders.</text>
<text x="1824.8" y="1213.5" text-anchor="middle" font-size="17" fill="#1c2633">Deepa: weekly metrics.</text>
<text x="34" y="1296" font-size="18" fill="#5b6575">Dashed arrows follow one planning run from the Monday/Thursday trigger to the people who act on it. Red boxes are what the Freshroots team sees.</text>
</svg>